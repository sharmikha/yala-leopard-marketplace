<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Leopard | Yala Leopard Conservation Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-brand">Yala Leopard Conservation</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="register.html">Register</a>
      <a href="my-sponsorships.html">My Certificates</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
    <button id="connectWalletBtn" class="btn-primary">Connect Wallet</button>
    <span id="walletAddress" class="wallet-address"></span>
  </header>

  <section class="form-container">
    <h1>Register a New Leopard</h1>
    <p>Admin only: add a newly identified leopard to the conservation registry and mint its sponsorship certificate.</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="leopardId">Leopard ID / Name</label>
        <input type="text" id="leopardId" placeholder="e.g. Y-14" required>
      </div>

      <div class="form-group">
        <label for="territory">Territory / Block</label>
        <input type="text" id="territory" placeholder="e.g. Block 1" required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Short notes on this leopard" required></textarea>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="Stable">Stable</option>
          <option value="Priority Tracking">Priority Tracking</option>
          <option value="Newly Identified">Newly Identified</option>
        </select>
      </div>

      <div class="form-group">
        <label for="imageURI">Photo URL / IPFS link</label>
        <input type="text" id="imageURI" placeholder="https://... or ipfs://...">
      </div>

      <div class="form-group">
        <label for="price">Initial sponsorship price (ETH)</label>
        <input type="number" id="price" step="0.001" min="0" placeholder="0.05" required>
      </div>

      <button type="submit" class="btn-primary">Register &amp; Mint Certificate</button>
    </form>

    <p id="registerStatus" class="placeholder-text"></p>
  </section>

  <footer>
    <p>DAS5003 Blockchain Fundamentals &mdash; PRAC1 Section 3 Group Project</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
